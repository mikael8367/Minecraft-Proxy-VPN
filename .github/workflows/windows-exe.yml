name: Build Mikael VPN for Windows
on:
  push:
    paths:
      - 'windows/**'
      - '.github/workflows/windows-exe.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish portable Windows app
        run: dotnet publish windows/MikaelVPN.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - name: Package ZIP
        run: Compress-Archive -Path publish/* -DestinationPath MikaelVPN-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MikaelVPN-Windows-x64
          path: MikaelVPN-Windows-x64.zip
          retention-days: 14